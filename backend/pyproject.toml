[project]
name = "dynamic-pricing-backend"
version = "1.0.0"
description = "Dynamic Pricing API con FastAPI"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.135.1",
    "fastparquet>=2025.12.0",
    "matplotlib>=3.8.0",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "plotly>=6.1.1",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.3",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "uvicorn>=0.41.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
